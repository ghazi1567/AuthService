# AuthService on one machine (for example an Ubuntu server): the reverse proxy that gets HTTPS certificates, the web console, the API,
# PostgreSQL and the one-off migration job. The step-by-step guide is docs/deployment.md, "Deploy on an Ubuntu server with Docker".
#
# The three AuthService images are pulled from the registry, at the version named by AUTHSERVICE_VERSION in .env, so a server needs
# only this file, the Caddyfile and .env (no source code):
#
#   cp .env.example .env      # then fill it in (never commit .env)
#   docker compose pull && docker compose up -d
#
# To build the images from source instead, add docker-compose.build.yml (see that file).
#
# Only ports 80 and 443 are published, by the proxy. The API, the web console and the database are reachable only through it (or from
# inside the stack). The proxy is listed as trusted, by its network, in both apps, so rate limits and audit entries see the real visitor.
name: authservice

x-logging: &logging
  # Container logs rotate, so they cannot fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_HOST: ${AUTH_HOST:?Set AUTH_HOST in deploy/.env, for example auth.example.com}
      APP_HOST: ${APP_HOST:?Set APP_HOST in deploy/.env, for example app.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates. Keep this volume: losing it means asking for new ones, which Let's Encrypt limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once per deployment and exits. The API never migrates on startup.
  migrate:
    image: ${AUTHSERVICE_REGISTRY:-ghcr.io/ghazi1567}/authservice-migrate:${AUTHSERVICE_VERSION:?Set AUTHSERVICE_VERSION in .env, for example 1.0.0}
    command: ["--connection", "Host=db;Port=5432;Database=auth;Username=auth;Password=${POSTGRES_PASSWORD}"]
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${AUTHSERVICE_REGISTRY:-ghcr.io/ghazi1567}/authservice-api:${AUTHSERVICE_VERSION:?Set AUTHSERVICE_VERSION in .env, for example 1.0.0}
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__AuthDb: Host=db;Port=5432;Database=auth;Username=auth;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Auth__Tokens__KeyEncryptionKey: ${AUTH_KEY_ENCRYPTION_KEY:?Set AUTH_KEY_ENCRYPTION_KEY in deploy/.env}
      Auth__Tokens__Issuer: ${AUTH_ISSUER:-AuthService}
      Email__Provider: ${EMAIL_PROVIDER:-Brevo}
      Email__BrevoApiKey: ${BREVO_API_KEY:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Auth Service}
      # Where the links in emails point: the web console, which handles /verify-email, /reset-password and /accept-invitation.
      Email__PublicBaseUrl: https://${APP_HOST:?Set APP_HOST in deploy/.env}
      # The proxy and the web console are both inside the stack's network. The proxy's X-Forwarded-For and the one the web console adds
      # for its own visitors are believed from here and from nowhere else.
      Auth__Proxy__TrustedNetworks__0: ${DOCKER_SUBNET:-172.29.200.0/24}
      # Who may read /metrics besides this machine. Blank means only the stack itself (and the proxy refuses /metrics from outside).
      Observability__AllowedNetworks__0: ${METRICS_ALLOWED_NETWORK:-}
      # One line per database command is too chatty for production; warnings and errors still show.
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # The service stores nothing with ASP.NET data protection, so its "keys may not persist" warning is noise.
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Error
      # Only used when EMAIL_PROVIDER=File (a trial run): the container user cannot write under /app.
      Email__FileDirectory: /tmp/emails
    # The aspnet image has no curl, and its sh cannot open /dev/tcp, so the check runs bash: it opens the port and asks for the
    # readiness endpoint.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ${AUTHSERVICE_REGISTRY:-ghcr.io/ghazi1567}/authservice-web:${AUTHSERVICE_VERSION:?Set AUTHSERVICE_VERSION in .env, for example 1.0.0}
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The API, by its name inside the stack. The web console calls it from its server, never from the browser.
      AuthService__Api__BaseUrl: http://api:8080
      AuthService__Proxy__TrustedNetworks__0: ${DOCKER_SUBNET:-172.29.200.0/24}
      # The keys that protect the cookies, kept on a volume so a restart or an update does not make every cookie unreadable.
      AuthService__DataProtection__KeysPath: /keys
      # The keys sit unencrypted in the volume, which data protection warns about at every start. What they protect is an opaque session
      # id in a cookie (never a token), and the files are readable only by the app's own user, so the warning is left out of the log.
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Error
    volumes:
      - webkeys:/keys
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dbdata:
  caddy_data:
  caddy_config:
  webkeys:

networks:
  default:
    ipam:
      config:
        # A fixed range, so the apps can name it as their trusted proxy network. Change it (DOCKER_SUBNET) only if it clashes with
        # a network your server already uses.
        - subnet: ${DOCKER_SUBNET:-172.29.200.0/24}
