name: Publish AuthService.Entitlements

# ENT-07 (AUTH-284): AuthService.Entitlements and AuthService.Entitlements.Testing are published from here and from nowhere else, the same
# way as AuthService.Authorization (decisions 0009 and 0010). Push a tag named entitlements-v<major>.<minor>.<patch> on a commit that is on
# main. Both packages get the tag's version. They depend on the AuthService.Authorization version named by MinimumAuthorizationVersion in
# src/AuthService.Entitlements/AuthService.Entitlements.csproj, which must already be published: release authorization-v<that> first.
# The nuget.org step needs a trusted publishing policy for THIS workflow file (the Authorization one does not cover it).

on:
  push:
    tags:
      - "entitlements-v*"

concurrency:
  group: publish-entitlements-package
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      authorization: ${{ steps.version.outputs.authorization }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check that the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main. Tag a commit that has been merged."
            exit 1
          fi

      - name: Read the versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#entitlements-v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::The tag '$tag' does not carry a semantic version. Use entitlements-v<major>.<minor>.<patch>[-prerelease]."
            exit 1
          fi
          authorization="$(dotnet msbuild src/AuthService.Entitlements/AuthService.Entitlements.csproj -getProperty:MinimumAuthorizationVersion)"
          if ! [[ "$authorization" =~ $semver ]]; then
            echo "::error::MinimumAuthorizationVersion is not a version: '$authorization'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "authorization=$authorization" >> "$GITHUB_OUTPUT"
          echo "Publishing AuthService.Entitlements $version, needing AuthService.Authorization $authorization"

  test:
    name: Build and test
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  publish:
    name: Pack and publish
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Version is what the AuthService.Authorization dependency is written with; EntitlementsVersion is these packages' own.
      - name: Pack
        run: |
          for project in src/AuthService.Entitlements src/AuthService.Entitlements.Testing; do
            dotnet pack "$project" --configuration Release --output artifacts/packages \
              -p:Version=${{ needs.version.outputs.authorization }} \
              -p:EntitlementsVersion=${{ needs.version.outputs.version }}
          done

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/AuthService.Entitlements*.nupkg
          retention-days: 30

      - name: Push to GitHub Packages
        run: |
          for package in AuthService.Entitlements AuthService.Entitlements.Testing; do
            dotnet nuget push "artifacts/packages/${package}.${{ needs.version.outputs.version }}.nupkg" \
              --source "$FEED" --api-key "${{ secrets.GITHUB_TOKEN }}"
          done

  verify:
    name: Install the published packages in the sample product
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Make the local package folder, empty
        run: mkdir -p artifacts/packages

      - name: Add the feed
        run: >
          dotnet nuget add source "$FEED"
          --name github
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile samples/NuGet.config

      - name: Test the sample product against the published packages
        run: >
          dotnet test samples/SampleProduct.Tests
          --configuration Release
          -p:AuthorizationPackageVersion=${{ needs.version.outputs.authorization }}
          -p:EntitlementsPackageVersion=${{ needs.version.outputs.version }}

  publish-nuget:
    name: Publish to nuget.org
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Get the packages that were verified
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Sign in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in AuthService.Entitlements AuthService.Entitlements.Testing; do
            dotnet nuget push "artifacts/packages/${package}.${{ needs.version.outputs.version }}.nupkg" \
              --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
