name: CI

# TST-03 (AUTH-35): the full regression suite runs on every pull request and on every push to main,
# against a real throwaway PostgreSQL started by Testcontainers (GitHub's Ubuntu runners include Docker).
# A failing test fails the "Build and test" job. Make that job a required status check on main
# (branch protection or a ruleset) to turn it into a hard merge gate; see README, "Continuous integration".

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this also gates on a clean build.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The GitHubActions logger writes failing tests, with their Test Case ID (TST_TC6_...), as annotations
      # on the pull request and as a summary on the workflow run.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "GitHubActions"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # The deployment images must keep building (docs/deployment.md). Nothing is pushed anywhere.
  docker-images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the API image
        run: docker build --tag authservice-api .

      - name: Build the migration image
        run: docker build --target migrate --tag authservice-migrate .

      - name: Build the web console image
        run: docker build --target web --tag authservice-web .

      # The compose files are what the deployment guide tells people to run, so the whole stack is started from source (the build override)
      # with throwaway secrets and local names, and checked from outside with the same script an operator uses after a deploy.
      - name: Start the whole stack and check it
        working-directory: deploy
        run: |
          cat > .env <<EOF
          AUTHSERVICE_VERSION=ci
          AUTH_HOST=auth.localhost
          APP_HOST=app.localhost
          ACME_EMAIL=ops@example.com
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          AUTH_KEY_ENCRYPTION_KEY=$(openssl rand -base64 32)
          EMAIL_PROVIDER=File
          EOF
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

          for service in api web; do
            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$service")" 2>/dev/null || true)"
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::$service did not become healthy (last state: ${status:-unknown})."
              docker compose logs --no-color --tail 100
              exit 1
            fi
          done

          CHECK_INSECURE=1 CHECK_IP=127.0.0.1 ./check.sh auth.localhost app.localhost

      - name: Stop the stack
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml down --volumes

  # PLT-07 (AUTH-204): a product installs AuthService.Authorization as a package, so the sample product does too. Nothing is
  # published: the package is packed here and the sample restores it from that folder, with no project reference. A release
  # (publish-authorization-package.yml) repeats this against the package it has published.
  sample-product:
    name: Sample product on the packed package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack the package
        run: >
          dotnet pack src/AuthService.Authorization
          --configuration Release
          --output artifacts/packages
          -p:Version=0.0.0-ci.${{ github.run_number }}

      - name: Test the sample product against it
        run: >
          dotnet test samples/SampleProduct.Tests
          --configuration Release
          -p:AuthorizationPackageVersion=0.0.0-ci.${{ github.run_number }}
