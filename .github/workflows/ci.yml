name: CI

# TST-03 (AUTH-35): the full regression suite runs on every pull request and on every push to main,
# against a real throwaway PostgreSQL started by Testcontainers (GitHub's Ubuntu runners include Docker).
# A failing test fails the "Build and test" job. Make that job a required status check on main
# (branch protection or a ruleset) to turn it into a hard merge gate; see README, "Continuous integration".

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this also gates on a clean build.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The GitHubActions logger writes failing tests, with their Test Case ID (TST_TC6_...), as annotations
      # on the pull request and as a summary on the workflow run.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "GitHubActions"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
